name: Отладка (служебный)
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Python-код"
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests certifi numpy
      - env: {CODE: "${{ inputs.code }}", MOEX_TOKEN: "${{ secrets.MOEX_TOKEN }}"}
        run: python -c "$CODE"
