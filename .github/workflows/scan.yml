name: Скан акций

on:
  workflow_dispatch:        # ручной запуск: вкладка Actions → «Скан акций» → Run workflow
  schedule:
    - cron: "10 16 * * 1-5" # пн–пт 19:10 МСК, после закрытия основной сессии

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Скан
        env:
          MOEX_TOKEN: ${{ secrets.MOEX_TOKEN }}   # необязательно; без него — публичный ISS
        run: python screener.py
      - name: Сохранить результат
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git commit -m "Скан $(date -u +%F)" || echo "без изменений"
          git push
